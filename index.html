<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Caiet BAC · Limba și literatura română</title>
    <meta
      name="description"
      content="Fișe, hărți mentale și pagini scanate pentru BAC la Limba și literatura română."
    />
    <meta name="theme-color" content="#4338ca" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      try {
        var t = localStorage.getItem("caiet-theme");
        var d =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>

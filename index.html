<!doctype html>
<html lang="ro">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Caiet BAC · Limba și Literatura Română</title>
        <meta
            name="description"
            content="Caiet de studiu pentru BAC la Limba și Literatura Română — poezii, proză, curente literare."
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        fontFamily: {
                            display: [
                                "Fraunces",
                                "ui-serif",
                                "Georgia",
                                "serif",
                            ],
                            sans: [
                                '"Source Sans 3"',
                                "ui-sans-serif",
                                "system-ui",
                                "sans-serif",
                            ],
                        },
                        colors: {
                            paper: "#F8FAFC",
                            ink: "#0F172A",
                            accent: {
                                DEFAULT: "#6366F1",
                                50: "#EEF0FF",
                                100: "#E0E3FF",
                                500: "#6366F1",
                                600: "#4F52D9",
                                700: "#4143B0",
                            },
                        },
                        boxShadow: {
                            card: "0 1px 2px 0 rgb(15 23 42 / 0.05), 0 1px 3px 0 rgb(15 23 42 / 0.06)",
                            "card-hover":
                                "0 8px 20px -6px rgb(15 23 42 / 0.15), 0 2px 6px -2px rgb(15 23 42 / 0.08)",
                        },
                    },
                },
            };
        </script>

        <link rel="stylesheet" href="styles.css" />
    </head>
    <body
        class="bg-paper dark:bg-slate-950 text-ink dark:text-slate-100 font-sans antialiased min-h-screen transition-colors duration-300"
    >
        <!-- ============ HEADER ============ -->
        <header
            class="sticky top-0 z-30 border-b border-slate-200/70 dark:border-slate-800 bg-paper/85 dark:bg-slate-950/85 backdrop-blur supports-[backdrop-filter]:bg-paper/70"
        >
            <div class="max-w-6xl mx-auto px-4 sm:px-6">
                <div class="h-16 flex items-center gap-3">
                    <a
                        href="#"
                        class="flex items-center gap-2 shrink-0 group"
                        aria-label="Caiet BAC — acasă"
                    >
                        <span
                            class="grid place-items-center w-8 h-8 rounded-lg bg-accent text-white font-display font-semibold text-sm shadow-card group-hover:shadow-card-hover transition-shadow"
                            >CB</span
                        >
                        <span
                            class="hidden sm:block font-display font-semibold text-[1.05rem] tracking-tight"
                            >Caiet <span class="text-accent">BAC</span></span
                        >
                    </a>

                    <!-- Search -->
                    <div class="flex-1 min-w-0">
                        <div class="relative max-w-md ml-0 sm:ml-2">
                            <svg
                                class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <circle cx="11" cy="11" r="7" />
                                <path
                                    stroke-linecap="round"
                                    d="m21 21-4.3-4.3"
                                />
                            </svg>
                            <input
                                id="search-input"
                                type="text"
                                placeholder="Caută un titlu, autor sau curent…"
                                autocomplete="off"
                                class="w-full pl-9 pr-14 py-2 text-sm rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-card placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-accent/60 focus:border-accent/60 transition"
                            />
                            <kbd
                                class="hidden sm:flex items-center gap-0.5 absolute right-2 top-1/2 -translate-y-1/2 text-[11px] font-medium text-slate-400 border border-slate-200 dark:border-slate-700 rounded px-1.5 py-0.5"
                                >/</kbd
                            >
                        </div>
                    </div>

                    <!-- Dark mode toggle -->
                    <button
                        id="theme-toggle"
                        type="button"
                        aria-label="Comută tema"
                        class="shrink-0 grid place-items-center w-9 h-9 rounded-full border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-card hover:shadow-card-hover transition-shadow"
                    >
                        <svg
                            id="icon-sun"
                            class="w-[18px] h-[18px] text-amber-500 hidden dark:block"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <circle cx="12" cy="12" r="4" />
                            <path
                                stroke-linecap="round"
                                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                            />
                        </svg>
                        <svg
                            id="icon-moon"
                            class="w-[18px] h-[18px] text-slate-600 dark:hidden"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
                            />
                        </svg>
                    </button>
                </div>

                <!-- Categories -->
                <div
                    id="filter-pills"
                    class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-3 -mt-0.5"
                >
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
            <div class="mb-6 flex items-baseline justify-between">
                <h1
                    class="font-display text-2xl sm:text-[1.7rem] font-semibold tracking-tight"
                >
                    Materiale de studiu
                </h1>
                <p
                    id="results-count"
                    class="text-sm text-slate-500 dark:text-slate-400 tabular-nums"
                ></p>
            </div>

            <div
                id="study-grid"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"
            >
            </div>

            <div
                id="empty-state"
                class="hidden flex-col items-center justify-center text-center py-24 gap-3"
            >
                <div
                    class="w-14 h-14 rounded-2xl bg-slate-100 dark:bg-slate-900 grid place-items-center"
                >
                    <svg
                        class="w-6 h-6 text-slate-400"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="11" cy="11" r="7" />
                        <path stroke-linecap="round" d="m21 21-4.3-4.3" />
                    </svg>
                </div>
                <p class="font-display text-lg">Niciun rezultat</p>
                <p class="text-sm text-slate-500 dark:text-slate-400 max-w-xs">
                    Încearcă alt termen de căutare sau selectează „Toate” din
                    filtre.
                </p>
            </div>
        </main>

        <footer
            class="max-w-6xl mx-auto px-4 sm:px-6 py-10 text-xs text-slate-400 dark:text-slate-600"
        >
            Materiale de studiu pentru BAC — Limba și literatura română. Sursele
            originale sunt indicate la fiecare fișă.
        </footer>

        <div
            id="modal-root"
            class="fixed inset-0 z-50 hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
        >
            <div
                id="modal-backdrop"
                class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm"
            ></div>

            <div class="relative h-full flex flex-col">
                <!-- top bar -->
                <div
                    class="flex items-center justify-between gap-3 px-4 sm:px-6 py-3 text-slate-100"
                >
                    <div class="min-w-0">
                        <p
                            id="modal-title"
                            class="font-display font-semibold text-base sm:text-lg truncate"
                        ></p>
                        <p
                            id="modal-author"
                            class="text-xs sm:text-sm text-slate-300 truncate"
                        ></p>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span
                            id="modal-page-indicator"
                            class="text-xs font-medium text-slate-300 tabular-nums px-2 py-1 rounded-full bg-white/10"
                        ></span>
                        <button
                            id="modal-close"
                            type="button"
                            aria-label="Închide"
                            class="grid place-items-center w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 transition-colors text-white"
                        >
                            <svg
                                class="w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    d="M6 6l12 12M18 6 6 18"
                                />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- image stage -->
                <div
                    id="modal-stage"
                    class="relative flex-1 min-h-0 overflow-hidden select-none"
                >
                    <button
                        id="modal-prev-page"
                        type="button"
                        aria-label="Pagina anterioară"
                        class="modal-nav-btn left-2 sm:left-4"
                    >
                        <svg
                            class="w-5 h-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2.5"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m15 18-6-6 6-6"
                            />
                        </svg>
                    </button>

                    <div
                        id="modal-img-wrap"
                        class="w-full h-full grid place-items-center overflow-auto touch-pinch-zoom p-4"
                    >
                        <img
                            id="modal-img"
                            src=""
                            alt=""
                            class="max-w-full max-h-full object-contain rounded-md shadow-2xl transition-transform duration-200 ease-out cursor-zoom-in"
                            draggable="false"
                        />
                    </div>

                    <button
                        id="modal-next-page"
                        type="button"
                        aria-label="Pagina următoare"
                        class="modal-nav-btn right-2 sm:right-4"
                    >
                        <svg
                            class="w-5 h-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2.5"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m9 18 6-6-6-6"
                            />
                        </svg>
                    </button>
                </div>

                <!-- page dots -->
                <div
                    id="modal-dots"
                    class="flex items-center justify-center gap-1.5 py-3"
                ></div>

                <!-- bottom drawer: source / copyright -->
                <div
                    id="modal-drawer"
                    class="border-t border-white/10 bg-slate-950/95 text-slate-200"
                >
                    <button
                        id="modal-drawer-toggle"
                        type="button"
                        class="w-full flex items-center justify-between gap-3 px-4 sm:px-6 py-3 text-left"
                    >
                        <span
                            class="flex items-center gap-2 text-sm font-medium"
                        >
                            <svg
                                class="w-4 h-4 text-slate-400"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 8v4m0 4h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"
                                />
                            </svg>
                            Sursă &amp; drepturi
                        </span>
                        <svg
                            id="modal-drawer-chevron"
                            class="w-4 h-4 text-slate-400 transition-transform"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m6 9 6 6 6-6"
                            />
                        </svg>
                    </button>
                    <div
                        id="modal-drawer-body"
                        class="hidden px-4 sm:px-6 pb-4 text-sm text-slate-400 space-y-2"
                    >
                        <p id="modal-source-line"></p>
                        <a
                            id="modal-pdf-link"
                            href="#"
                            target="_blank"
                            rel="noopener"
                            class="hidden inline-flex items-center gap-1.5 text-accent hover:text-accent-500 font-medium"
                        >
                            <svg
                                class="w-4 h-4"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"
                                />
                            </svg>
                            Descarcă PDF-ul sursă
                        </a>
                    </div>
                </div>

                <!-- switch between works -->
                <div
                    class="flex items-center justify-between px-4 sm:px-6 py-2.5 border-t border-white/10 bg-slate-950 text-slate-300 text-xs sm:text-sm"
                >
                    <button
                        id="modal-prev-work"
                        type="button"
                        class="modal-work-btn"
                    >
                        <svg
                            class="w-4 h-4"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m15 18-6-6 6-6"
                            />
                        </svg>
                        Lucrarea anterioară
                    </button>
                    <button
                        id="modal-next-work"
                        type="button"
                        class="modal-work-btn"
                    >
                        Lucrarea următoare
                        <svg
                            class="w-4 h-4"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m9 18 6-6 6-6"
                            />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <script src="data.js"></script>
        <script src="app.js"></script>
    </body>
</html>
